server:
  port: 8086

spring:
  application:
    name: funcionario-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/funcionario_db}
    username: ${SPRING_DATASOURCE_USERNAME:marketflow}
    password: ${SPRING_DATASOURCE_PASSWORD:marketflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

auth:
  session-duration-minutes: ${AUTH_SESSION_DURATION_MINUTES:60}
  cargos-autorizados: ${AUTH_CARGOS_AUTORIZADOS:OPERADOR,SUPERVISOR,GERENTE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
