spring:
  datasource:
    url: jdbc:h2:mem:funcionario_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

auth:
  session-duration-minutes: 60
  cargos-autorizados: OPERADOR,SUPERVISOR,GERENTE
