spring:
  datasource:
    url: jdbc:h2:mem:expedicao_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

aws:
  endpoint: http://localhost:4566
  region: us-east-1
  sns:
    saga-topic-arn: arn:aws:sns:us-east-1:000000000000:saga-events-topic
  sqs:
    expedicao-queue-url: http://localhost:4566/000000000000/expedicao-service-queue
    poll-interval-ms: 2000
    polling-enabled: false

outbox:
  poll-interval-ms: 2000
  batch-size: 10
  polling-enabled: false
