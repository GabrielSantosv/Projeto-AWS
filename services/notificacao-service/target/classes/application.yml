server:
  port: 8084

spring:
  application:
    name: notificacao-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notificacao_db}
    username: ${SPRING_DATASOURCE_USERNAME:marketflow}
    password: ${SPRING_DATASOURCE_PASSWORD:marketflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

aws:
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  sqs:
    notificacao-queue-url: ${NOTIFICACAO_QUEUE_URL:http://localhost:4566/000000000000/notificacao-service-queue}
    poll-interval-ms: ${SQS_POLL_INTERVAL_MS:2000}
    polling-enabled: ${SQS_POLLING_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
