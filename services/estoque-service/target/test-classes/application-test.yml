spring:
  datasource:
    url: jdbc:h2:mem:estoque_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

aws:
  endpoint: http://localhost:4566
  region: us-east-1
  sns:
    saga-topic-arn: arn:aws:sns:us-east-1:000000000000:saga-events-topic
    outbox-poll-interval-ms: 100
    outbox-batch-size: 10
  sqs:
    estoque-queue-url: http://localhost:4566/000000000000/estoque-service-queue
    poll-interval-ms: 2000
    polling-enabled: false
